name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - run: npm install
      - run: npx cap add android
      - run: mkdir -p assets && cp icon-only.png assets/icon-only.png
      - run: npx @capacitor/assets generate --android --iconBackgroundColor "#0e9f6e" --iconBackgroundColorDark "#0e9f6e"
        continue-on-error: true
      - run: rm -f www/*.apk
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: masik-hisab-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
