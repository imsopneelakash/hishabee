name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - run: npm install
      - run: npx cap add android
      - run: mkdir -p assets && cp icon-only.png assets/icon-only.png
      - run: npx @capacitor/assets generate --android --iconBackgroundColor "#0e9f6e" --iconBackgroundColorDark "#0e9f6e"
        continue-on-error: true
      - run: rm -f www/*.apk
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleRelease
      - name: Sign APK
        run: |
          echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > $RUNNER_TEMP/ks.jks
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/zipalign -f -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk $RUNNER_TEMP/a.apk
          $BT/apksigner sign --ks $RUNNER_TEMP/ks.jks --ks-pass pass:${{ secrets.KS_PASS }} --ks-key-alias masik --out masik-hisab.apk $RUNNER_TEMP/a.apk
      - uses: actions/upload-artifact@v4
        with:
          name: masik-hisab-apk
          path: masik-hisab.apk
