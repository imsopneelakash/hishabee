<!DOCTYPE html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>মাসিক হিসাব</title>
<style>
:root{--bg:#f4f7f5;--c:#fff;--t:#16221c;--m:#68776f;--p:#0e9f6e;--r:#e04848;--b:#e2e9e5}
[data-th=dark]{--bg:#0e1411;--c:#17201b;--t:#e7efea;--m:#8b9c93;--b:#25322b}
*{box-sizing:border-box;margin:0}body{font-family:system-ui,"Noto Sans Bengali",sans-serif;background:var(--bg);color:var(--t);padding:env(safe-area-inset-top) 0 calc(70px + env(safe-area-inset-bottom))}
#v{padding:14px;max-width:560px;margin:auto}h1{font-size:20px;margin:6px 0 12px}h2{font-size:15px;margin:16px 0 8px}
.c{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:14px;margin-bottom:10px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.m{color:var(--m);font-size:12px}.big{font-size:22px;font-weight:700}.in{color:var(--p)}.ex{color:var(--r)}
.bar{height:8px;background:var(--b);border-radius:6px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--p)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--b)}.row:last-child{border:0}
button,input,select{font:inherit;color:var(--t)}input,select{width:100%;padding:11px;border:1px solid var(--b);border-radius:10px;background:var(--bg);margin-bottom:8px}
.btn{background:var(--p);color:#fff;border:0;border-radius:10px;padding:11px 14px;width:100%}.btn.s{width:auto;padding:6px 10px;font-size:13px}.btn.o{background:none;border:1px solid var(--b);color:var(--t)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}.chip{border:1px solid var(--b);background:var(--bg);border-radius:20px;padding:6px 11px;font-size:13px}.chip.on{background:var(--p);color:#fff;border-color:var(--p)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--c);border-top:1px solid var(--b);padding-bottom:env(safe-area-inset-bottom)}nav button{flex:1;background:none;border:0;padding:11px 0;font-size:12px;color:var(--m)}nav button.on{color:var(--p);font-weight:700}
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:50%;background:var(--p);color:#fff;border:0;font-size:30px;box-shadow:0 4px 14px #0004}
#m{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;z-index:9}#m.on{display:flex}#m>div{background:var(--c);width:100%;max-width:560px;margin:auto;border-radius:18px 18px 0 0;padding:16px;max-height:90vh;overflow:auto}
#lock{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;justify-content:center;padding:30px;gap:10px;text-align:center}
</style></head><body><div id="v"></div><div id="m"></div><nav id="n"></nav><div id="lock" style="display:none"></div>
<script>
const K="mh1";let S=JSON.parse(localStorage.getItem(K)||"null")||{e:[],l:[],b:15000,lang:"bn",th:"light",pin:"",rec:[]};
const save=()=>localStorage.setItem(K,JSON.stringify(S)),$=i=>document.getElementById(i),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const D=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const L={bn:{home:"হোম",ex:"খরচ",rep:"রিপোর্ট",loan:"ঋণ",set:"সেটিং",inc:"আয়",exp:"খরচ",bal:"ব্যালেন্স",bud:"মাসিক বাজেট",left:"বাকি",over:"বাজেট ছাড়িয়েছে",edit:"বদলান",recent:"সাম্প্রতিক",none:"এখনো কিছু নেই — + চেপে যোগ করুন",amt:"পরিমাণ",date:"তারিখ",note:"নোট",cat:"ক্যাটাগরি",save:"সেভ করুন",rm:"মুছবেন?",monthly:"প্রতি মাসে অটো যোগ হবে",search:"খুঁজুন",day:"আজ",week:"৭ দিন",month:"এই মাস",csv:"CSV শেয়ার করুন",give:"আমি দিয়েছি (পাবো)",take:"আমি নিয়েছি (দেবো)",who:"কার সাথে",due:"ফেরতের তারিখ",toget:"মোট পাবো",toowe:"মোট দেবো",pay:"ফেরত/কিস্তি যোগ",paid:"ফেরত",rest:"বাকি",done:"শোধ হয়েছে",lang:"ভাষা",theme:"ডার্ক থিম",pin:"অ্যাপ লক PIN",setpin:"PIN সেট করুন (৪ সংখ্যা)",nopin:"PIN বন্ধ করুন",unlock:"আনলক",enter:"PIN দিন",wrong:"ভুল PIN",newloan:"নতুন ঋণ/ধার",add:"যোগ করুন",tot:"মোট"},
en:{home:"Home",ex:"Expenses",rep:"Reports",loan:"Loans",set:"Settings",inc:"Income",exp:"Expense",bal:"Balance",bud:"Monthly budget",left:"left",over:"Over budget",edit:"Edit",recent:"Recent",none:"Nothing yet — tap + to add",amt:"Amount",date:"Date",note:"Note",cat:"Category",save:"Save",rm:"Delete?",monthly:"Auto-add every month",search:"Search",day:"Today",week:"7 days",month:"This month",csv:"Share CSV",give:"I lent (receivable)",take:"I borrowed (payable)",who:"Person",due:"Due date",toget:"To receive",toowe:"To pay",pay:"Add repayment",paid:"Paid",rest:"Left",done:"Settled",lang:"Language",theme:"Dark theme",pin:"App lock PIN",setpin:"Set a 4-digit PIN",nopin:"Turn off PIN",unlock:"Unlock",enter:"Enter PIN",wrong:"Wrong PIN",newloan:"New loan",add:"Add",tot:"Total"}};
const t=k=>L[S.lang][k]||k,bn=()=>S.lang=="bn",N=x=>"৳ "+Number(x).toLocaleString(bn()?"bn-BD":"en-US");
const C=[["bajar","বাজার","Grocery","🛒"],["rent","বাসা ভাড়া","Rent","🏠"],["trans","যাতায়াত","Transport","🚌"],["util","ইউটিলিটি বিল","Utility","💡"],["edu","শিক্ষা","Education","📚"],["health","স্বাস্থ্য","Health","💊"],["elec","বিদ্যুৎ","Electricity","🔌"],["gas","গ্যাস","Gas","🔥"],["other","অন্যান্য","Other","📦"]],I=[["salary","বেতন","Salary","💰"],["biz","ব্যবসা","Business","🏪"],["oth","অন্যান্য","Other","➕"]];
const cn=id=>{const x=[...C,...I].find(a=>a[0]==id)||[id,id,id,""];return x[3]+" "+(bn()?x[1]:x[2])};
let tab="home",rp="month",q="",F={ty:"ex",c:"bajar"},LD={dir:"give"};
const ym=()=>D().slice(0,7);
S.rec.forEach(r=>{if(r.last!=ym()){S.e.push({id:uid(),d:D(),ty:"ex",c:r.c,a:r.a,n:r.n});r.last=ym()}});save();
const mon=()=>S.e.filter(e=>e.d.slice(0,7)==ym());
const sum=(a,ty)=>a.filter(e=>e.ty==ty).reduce((s,e)=>s+e.a,0);
const erow=e=>`<div class="row"><div>${cn(e.c)}<div class="m">${e.d} ${esc(e.n)}</div></div><b class="${e.ty}">${e.ty=="in"?"+":"-"}${N(e.a)}</b></div>`;
function donut(a){const m={};a.filter(e=>e.ty=="ex").forEach(e=>m[e.c]=(m[e.c]||0)+e.a);const tot=Object.values(m).reduce((x,y)=>x+y,0);if(!tot)return"";const cl=["#0e9f6e","#e04848","#f5a524","#3b82f6","#8b5cf6","#14b8a6","#ec4899","#64748b","#a3a3a3"];let o=0,s="",lg="";Object.entries(m).sort((x,y)=>y[1]-x[1]).forEach(([k,v],i)=>{const p=v/tot*100;s+=`<circle r="15.9155" cx="21" cy="21" fill="none" stroke="${cl[i%9]}" stroke-width="6" stroke-dasharray="${p} ${100-p}" stroke-dashoffset="${-o}"/>`;o+=p;lg+=`<div class="row"><span><span style="color:${cl[i%9]}">●</span> ${cn(k)}</span><span>${N(v)} · ${Math.round(p)}%</span></div>`});return`<div style="text-align:center"><svg viewBox="0 0 42 42" width="160"><g transform="rotate(-90 21 21)">${s}</g></svg></div>`+lg}
const lrest=l=>l.a-l.pay.reduce((s,p)=>s+p.a,0);
const V={
home(){const a=mon(),ex=sum(a,"ex"),i=sum(a,"in"),b=S.b,p=b?Math.min(100,ex/b*100):0;return`<h1>মাসিক হিসাব</h1><div class="g3"><div class="c"><div class="m">${t("inc")}</div><b class="in">${N(i)}</b></div><div class="c"><div class="m">${t("exp")}</div><b class="ex">${N(ex)}</b></div><div class="c"><div class="m">${t("bal")}</div><b>${N(i-ex)}</b></div></div>
<div class="c"><div class="row" style="border:0;padding:0"><b>${t("bud")}</b><button class="btn s o" onclick="eb()">${t("edit")}</button></div><div class="big">${N(b)}</div><div class="bar"><i style="width:${p}%;${ex>b?"background:var(--r)":""}"></i></div><div class="m">${ex>b?t("over")+": "+N(ex-b):N(b-ex)+" "+t("left")}</div></div>
<h2>${t("recent")}</h2><div class="c">${S.e.length?[...S.e].sort((x,y)=>y.d.localeCompare(x.d)).slice(0,6).map(erow).join(""):`<div class="m">${t("none")}</div>`}</div><button class="fab" onclick="ae()">+</button>`},
ex(){const l=[...S.e].filter(e=>(cn(e.c)+e.n+e.a).toLowerCase().includes(q.toLowerCase())).sort((x,y)=>y.d.localeCompare(x.d));return`<h1>${t("ex")}</h1><input id="q" placeholder="${t("search")}" value="${esc(q)}" oninput="q=this.value;rn(1)"><div class="c">${l.length?l.map(e=>`<div class="row"><div>${cn(e.c)}<div class="m">${e.d} ${esc(e.n)}</div></div><div style="text-align:right"><b class="${e.ty}">${e.ty=="in"?"+":"-"}${N(e.a)}</b><br><a class="m" onclick="de('${e.id}')">🗑</a></div></div>`).join(""):`<div class="m">${t("none")}</div>`}</div><button class="fab" onclick="ae()">+</button>`},
rep(){const d=D(),w=new Date(Date.now()-6*864e5),wd=w.getFullYear()+"-"+String(w.getMonth()+1).padStart(2,"0")+"-"+String(w.getDate()).padStart(2,"0");const a=S.e.filter(e=>rp=="day"?e.d==d:rp=="week"?e.d>=wd:e.d.slice(0,7)==ym());return`<h1>${t("rep")}</h1><div class="chips">${["day","week","month"].map(k=>`<span class="chip ${rp==k?"on":""}" onclick="rp='${k}';rn()">${t(k)}</span>`).join("")}</div><div class="g"><div class="c"><div class="m">${t("inc")}</div><b class="in">${N(sum(a,"in"))}</b></div><div class="c"><div class="m">${t("exp")}</div><b class="ex">${N(sum(a,"ex"))}</b></div></div><div class="c">${donut(a)||`<div class="m">${t("none")}</div>`}</div><button class="btn" onclick="csv()">${t("csv")}</button>`},
loan(){const o=S.l.filter(l=>l.dir=="give").reduce((s,l)=>s+lrest(l),0),w=S.l.filter(l=>l.dir=="take").reduce((s,l)=>s+lrest(l),0);return`<h1>${t("loan")}</h1><div class="g"><div class="c"><div class="m">${t("toget")}</div><b class="in">${N(o)}</b></div><div class="c"><div class="m">${t("toowe")}</div><b class="ex">${N(w)}</b></div></div>${S.l.map(l=>{const r=lrest(l),p=Math.min(100,(l.a-r)/l.a*100);return`<div class="c"><div class="row" style="border:0;padding:0"><b>${l.dir=="give"?"↗":"↙"} ${esc(l.who)}</b><b class="${l.dir=="give"?"in":"ex"}">${N(l.a)}</b></div><div class="bar"><i style="width:${p}%"></i></div><div class="m">${t("paid")} ${N(l.a-r)} · ${r?t("rest")+" "+N(r):"✔ "+t("done")}${l.due?" · "+l.due:""}${l.n?" · "+esc(l.n):""}</div><div style="display:flex;gap:8px;margin-top:8px">${r?`<button class="btn s" onclick="pl('${l.id}')">${t("pay")}</button>`:""}<button class="btn s o" onclick="dl('${l.id}')">🗑</button></div></div>`}).join("")||`<div class="c m">${t("none")}</div>`}<button class="fab" onclick="al()">+</button>`},
set(){return`<h1>${t("set")}</h1><div class="c"><div class="row"><span>${t("lang")}</span><button class="btn s o" onclick="S.lang=bn()?'en':'bn';save();rn()">বাং / EN</button></div><div class="row"><span>${t("theme")}</span><button class="btn s o" onclick="S.th=S.th=='dark'?'light':'dark';save();rn()">${S.th=="dark"?"ON":"OFF"}</button></div><div class="row"><span>${t("pin")}</span>${S.pin?`<button class="btn s o" onclick="S.pin='';save();rn()">${t("nopin")}</button>`:`<button class="btn s o" onclick="sp()">${t("setpin")}</button>`}</div></div>`}};
function rn(keep){document.documentElement.dataset.th=S.th;document.documentElement.lang=S.lang;$("v").innerHTML=V[tab]();$("n").innerHTML=["home","ex","rep","loan","set"].map(k=>`<button class="${tab==k?"on":""}" onclick="tab='${k}';rn()">${{home:"🏠",ex:"🧾",rep:"📊",loan:"🤝",set:"⚙️"}[k]}<br>${t(k)}</button>`).join("");if(keep){const e=$("q");if(e){e.focus();e.setSelectionRange(99,99)}}}
const M=h=>{$("m").innerHTML="<div>"+h+"</div>";$("m").classList.add("on")},X=()=>$("m").classList.remove("on");$("m").onclick=e=>{if(e.target.id=="m")X()};
function ae(){F={ty:"ex",c:"bajar"};af()}
function af(){const cs=F.ty=="ex"?C:I;M(`<div class="chips"><span class="chip ${F.ty=="ex"?"on":""}" onclick="F.ty='ex';F.c='bajar';af()">${t("exp")}</span><span class="chip ${F.ty=="in"?"on":""}" onclick="F.ty='in';F.c='salary';af()">${t("inc")}</span></div><div class="chips">${cs.map(c=>`<span class="chip ${F.c==c[0]?"on":""}" onclick="F.c='${c[0]}';af()">${c[3]} ${bn()?c[1]:c[2]}</span>`).join("")}</div><input id="fa" type="number" inputmode="decimal" placeholder="${t("amt")}" value="${F.a||""}" oninput="F.a=this.value"><input id="fd" type="date" value="${F.d||D()}" onchange="F.d=this.value"><input id="fn" placeholder="${t("note")}" value="${esc(F.n)}" oninput="F.n=this.value">${F.ty=="ex"?`<label class="m"><input type="checkbox" style="width:auto" onchange="F.r=this.checked" ${F.r?"checked":""}> ${t("monthly")}</label>`:""}<button class="btn" onclick="se()">${t("save")}</button>`)}
function se(){const a=parseFloat(F.a);if(!a||a<=0)return;const d=F.d||D();S.e.push({id:uid(),d,ty:F.ty,c:F.c,a,n:F.n||""});if(F.r&&F.ty=="ex")S.rec.push({id:uid(),c:F.c,a,n:F.n||"",last:d.slice(0,7)});save();X();rn()}
function de(id){if(confirm(t("rm"))){S.e=S.e.filter(e=>e.id!=id);save();rn()}}
function eb(){const v=parseFloat(prompt(t("bud"),S.b));if(v>=0){S.b=v;save();rn()}}
function al(){LD={dir:"give"};lf()}
function lf(){M(`<div class="chips"><span class="chip ${LD.dir=="give"?"on":""}" onclick="LD.dir='give';lf()">${t("give")}</span><span class="chip ${LD.dir=="take"?"on":""}" onclick="LD.dir='take';lf()">${t("take")}</span></div><input placeholder="${t("who")}" value="${esc(LD.who)}" oninput="LD.who=this.value"><input type="number" inputmode="decimal" placeholder="${t("amt")}" value="${LD.a||""}" oninput="LD.a=this.value"><div class="m">${t("date")}</div><input type="date" value="${LD.d||D()}" onchange="LD.d=this.value"><div class="m">${t("due")}</div><input type="date" value="${LD.due||""}" onchange="LD.due=this.value"><input placeholder="${t("note")}" value="${esc(LD.n)}" oninput="LD.n=this.value"><button class="btn" onclick="sl()">${t("save")}</button>`)}
function sl(){const a=parseFloat(LD.a);if(!a||!LD.who)return;S.l.push({id:uid(),dir:LD.dir,who:LD.who,a,d:LD.d||D(),due:LD.due||"",n:LD.n||"",pay:[]});save();X();rn()}
function pl(id){const l=S.l.find(x=>x.id==id),v=parseFloat(prompt(t("pay")+" ("+t("rest")+": "+lrest(l)+")"));if(v>0){l.pay.push({d:D(),a:Math.min(v,lrest(l))});save();rn()}}
function dl(id){if(confirm(t("rm"))){S.l=S.l.filter(l=>l.id!=id);save();rn()}}
function sp(){const p=prompt(t("setpin"));if(/^\d{4}$/.test(p||"")){S.pin=p;save();rn()}}
async function csv(){const rows=[["Date","Type","Category","Amount","Note"],...S.e.map(e=>[e.d,e.ty,e.c,e.a,'"'+(e.n||"").replace(/"/g,'""')+'"'])].map(r=>r.join(",")).join("\n"),P=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.Share;if(P){try{await P.share({title:"masik-hisab.csv",text:rows});return}catch(e){}}const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+rows],{type:"text/csv"}));a.download="masik-hisab.csv";a.click()}
function lk(){if(!S.pin)return;const k=$("lock");k.style.display="flex";k.innerHTML=`<h1>মাসিক হিসাব</h1><input id="pi" type="password" inputmode="numeric" maxlength="4" placeholder="${t("enter")}" style="text-align:center;font-size:24px"><button class="btn" onclick="if($('pi').value==S.pin){$('lock').style.display='none'}else{$('pi').value='';$('pi').placeholder=t('wrong')}">${t("unlock")}</button>`}
rn();lk();
</script></body></html>
